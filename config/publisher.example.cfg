[http]
port = 80

[pg]
# DSN takes user/password/host/port/dbname/sslmode. Dev devs put real creds
# in their local publisher.cfg (gitignored); prod overrides via the
# PG_DSN env var injected by k8s Secret.
dsn = postgres://<user>:<password>@<host>:5432/tokenplatform_publisher?sslmode=disable

[redis]
addr = 127.0.0.1:6379
password =
db = 0

[worker]
scan_interval_ms = 1000
batch_per_tick = 100
max_attempts = 12
base_delay_ms = 1000
max_delay_ms = 60000
delivered_retain_hours = 168
dead_letter_retain_hours = 720

[key_admission]
# Compatibility default. Enable only after Billing sends a UUID decision_id
# and positive monotonic decision_version on every PUT/bulk/DELETE.
strict = false

# Caller services are bound by URL namespace (user/billing/admin/sre) and
# a list of valid bearer tokens. tokens is a comma-separated array
# supporting rotation: append a new token, deploy, then later drop the old
# one once all callers have migrated. Generate strong random tokens (256
# bits of CSPRNG entropy) in production via:
#   make new-tokens COUNT=3 PREFIX=user
#
# Prod overrides the whole block via the CALLERS_JSON env var, shape:
#   {"user-service": {"namespace": "user", "tokens": ["..."]}, ...}

[caller:user-service]
namespace = user
tokens    = user-token-CHANGE-ME-1, user-token-CHANGE-ME-2

[caller:billing-service]
namespace = billing
tokens    = billing-token-CHANGE-ME

[caller:admin-service]
namespace = admin
tokens    = admin-token-CHANGE-ME

[caller:sre-oncall]
namespace = sre
tokens    = sre-token-CHANGE-ME
