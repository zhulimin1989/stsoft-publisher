name: ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: publisher
          POSTGRES_PASSWORD: publisher
          POSTGRES_DB: tokenplatform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U publisher -d tokenplatform"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TP_PUBLISHER_PG_DSN: postgres://publisher:publisher@127.0.0.1:5432/tokenplatform?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
